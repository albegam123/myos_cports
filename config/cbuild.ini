[apk]
repo = https://repo.chimera-linux.org/current

[build]
# Templates are checked by scripts/check.sh and cports lint before release.
# Keeping these off here avoids adding Python formatting tools to the host's
# minimal bootstrap requirements.
linter = none
formatter = none
build_dbg = no
remote = yes
categories = main user

[signing]
key = your_private_key.rsa
